<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora</title>
<style>
:root{--bg:#e9edf0;--body:#1f2a33;--screen:#c9d8c5;--ink:#1d2b1f;--key:#f7f8f9;--keytxt:#1f2a33;--op:#3d6b8c;--optxt:#fff;--eq:#d9822b;--clr:#c8d0d6;--shadow:#b7c0c7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171b;--body:#222c34;--screen:#a9bda6;--key:#34404a;--keytxt:#eef2f5;--op:#4f86ad;--clr:#4a5863;--shadow:#0c1013}}
:root[data-theme="dark"]{--bg:#12171b;--body:#222c34;--screen:#a9bda6;--key:#34404a;--keytxt:#eef2f5;--op:#4f86ad;--clr:#4a5863;--shadow:#0c1013}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:"Trebuchet MS",Verdana,sans-serif}
.calc{width:min(340px,92vw);background:var(--body);padding:18px;border-radius:22px;box-shadow:0 10px 0 var(--shadow)}
.screen{background:var(--screen);color:var(--ink);border-radius:10px;padding:12px 14px;margin-bottom:16px;text-align:right;min-height:84px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.hist{font-size:14px;opacity:.65;min-height:18px;word-break:break-all}
.cur{font-family:"Courier New",monospace;font-size:38px;font-weight:700;word-break:break-all;line-height:1.1}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{font:inherit;font-size:22px;padding:16px 0;border:0;border-radius:12px;background:var(--key);color:var(--keytxt);cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
button:focus-visible{outline:3px solid var(--eq);outline-offset:2px}
.op{background:var(--op);color:var(--optxt)}
.clr{background:var(--clr)}
.eq{background:var(--eq);color:#fff}
</style>
</head>
<body>
<main class="calc">
  <div class="screen" aria-live="polite"><div class="hist" id="hist"></div><div class="cur" id="cur">0</div></div>
  <div class="keys">
    <button class="clr" data-a="clear">C</button>
    <button class="clr" data-a="back" aria-label="Apagar">⌫</button>
    <button class="clr" data-a="pct">%</button>
    <button class="op" data-o="/">÷</button>
    <button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button>
    <button class="op" data-o="*">×</button>
    <button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button>
    <button class="op" data-o="-">−</button>
    <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button>
    <button class="op" data-o="+">+</button>
    <button data-n="0" style="grid-column:span 2">0</button>
    <button data-n=".">,</button>
    <button class="eq" data-a="eq">=</button>
  </div>
</main>
<script>
let cur="0",prev=null,op=null,fresh=false;
const sym={"+":"+","-":"−","*":"×","/":"÷"};
const $c=document.getElementById("cur"),$h=document.getElementById("hist");
const fmt=s=>String(s).replace(".",",");
function show(){$c.textContent=fmt(cur);$h.textContent=prev!==null&&op?fmt(prev)+" "+sym[op]:"";}
function calc(a,b,o){a=parseFloat(a);b=parseFloat(b);
  if(o==="/"&&b===0)return "Erro";
  const r={"+":a+b,"-":a-b,"*":a*b,"/":a/b}[o];
  return String(parseFloat(r.toPrecision(12)));}
function num(n){
  if(cur==="Erro")cur="0";
  if(fresh){cur="0";fresh=false;}
  if(n==="."){if(!cur.includes("."))cur+=".";}
  else cur=cur==="0"?n:cur+n;
  show();}
function setOp(o){
  if(cur==="Erro")return;
  if(op&&!fresh)cur=calc(prev,cur,op);
  prev=cur;op=o;fresh=true;show();}
function equals(){
  if(!op||cur==="Erro")return;
  const r=calc(prev,cur,op);
  $h.textContent=fmt(prev)+" "+sym[op]+" "+fmt(cur)+" =";
  cur=r;prev=null;op=null;fresh=true;$c.textContent=fmt(cur);}
function act(a){
  if(a==="clear"){cur="0";prev=null;op=null;fresh=false;show();}
  else if(a==="back"){if(fresh||cur==="Erro")return;cur=cur.length>1?cur.slice(0,-1):"0";show();}
  else if(a==="pct"){if(cur==="Erro")return;cur=String(parseFloat((parseFloat(cur)/100).toPrecision(12)));show();}
  else if(a==="eq")equals();}
document.querySelector(".keys").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.n!==undefined)num(b.dataset.n);
  else if(b.dataset.o)setOp(b.dataset.o);
  else act(b.dataset.a);});
document.addEventListener("keydown",e=>{
  if(/^[0-9.]$/.test(e.key))num(e.key);
  else if(e.key===","){num(".");}
  else if("+-*/".includes(e.key))setOp(e.key);
  else if(e.key==="Enter"||e.key==="="){e.preventDefault();equals();}
  else if(e.key==="Backspace")act("back");
  else if(e.key==="Escape")act("clear");});
</script>
</body>
</html>
